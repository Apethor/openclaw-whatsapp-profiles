; Runs the three long-lived bot processes inside one container. Logs are sent to
; the container stdout/stderr so `docker logs` shows everything. Any crash is
; auto-restarted; if a process keeps crashing supervisord surfaces it in the logs.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:gateway]
command=node_modules/.bin/openclaw gateway run --force --allow-unconfigured
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:control]
command=node_modules/.bin/tsx scripts/openclaw-control.ts
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=node_modules/.bin/tsx src/index.ts
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
